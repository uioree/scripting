<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>
    <div class="ambient-glow glow-3"></div>

    <div class="page-container">
        <div id="toast-container" class="toast-container" aria-live="polite"></div>

        <main class="auth-card">
            <header class="brand-header">
                <div class="brand-logo">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
                    </svg>
                </div>
                <h1 class="brand-title">Aura</h1>
                <p class="brand-subtitle" id="form-subtitle">Добро пожаловать в систему</p>
            </header>

            <nav class="auth-tabs" id="auth-tabs">
                <button type="button" class="tab-btn active" id="tab-login" data-tab="login">Вход</button>
                <button type="button" class="tab-btn" id="tab-register" data-tab="register">Регистрация</button>
                <div class="tab-slider" id="tab-slider"></div>
            </nav>

            <form id="login-form" class="auth-form active" novalidate>
                <div class="input-group">
                    <label for="login-identifier">Имя пользователя или Email</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                        <input type="text" id="login-identifier" name="login" placeholder="alex@example.com" required autocomplete="username">
                    </div>
                </div>

                <div class="input-group">
                    <div class="label-row">
                        <label for="login-password">Пароль</label>
                        <a href="#" class="forgot-link" tabindex="-1">Забыли пароль?</a>
                    </div>
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                        <input type="password" id="login-password" name="password" placeholder="••••••••" required autocomplete="current-password">
                        <button type="button" class="toggle-password" data-target="login-password" aria-label="Показать пароль">
                            <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="submit-btn" id="login-btn">
                    <span class="btn-text">Войти в аккаунт</span>
                    <span class="btn-loader"></span>
                </button>
            </form>

            <form id="register-form" class="auth-form" novalidate>
                <div class="input-group">
                    <label for="reg-username">Имя пользователя</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                        <input type="text" id="reg-username" name="username" placeholder="alexander" required minlength="3" autocomplete="username">
                    </div>
                </div>

                <div class="input-group">
                    <label for="reg-email">Электронная почта</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                            <polyline points="22,6 12,13 2,6"></polyline>
                        </svg>
                        <input type="email" id="reg-email" name="email" placeholder="alex@domain.com" required autocomplete="email">
                    </div>
                </div>

                <div class="input-group">
                    <label for="reg-password">Пароль</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                        <input type="password" id="reg-password" name="password" placeholder="Минимум 6 символов" required minlength="6" autocomplete="new-password">
                        <button type="button" class="toggle-password" data-target="reg-password" aria-label="Показать пароль">
                            <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>

                    <div class="password-meter" id="password-meter">
                        <div class="meter-bars">
                            <div class="bar"></div>
                            <div class="bar"></div>
                            <div class="bar"></div>
                            <div class="bar"></div>
                        </div>
                        <span class="meter-text" id="meter-text">Сложность пароля</span>
                    </div>
                </div>

                <button type="submit" class="submit-btn" id="register-btn">
                    <span class="btn-text">Создать аккаунт</span>
                    <span class="btn-loader"></span>
                </button>
            </form>

            <div id="user-dashboard" class="user-dashboard">
                <div class="avatar-circle" id="dash-avatar">U</div>
                <h2 class="dash-welcome">Успешный вход!</h2>
                <div class="user-details-card">
                    <div class="detail-row">
                        <span class="detail-label">Имя:</span>
                        <span class="detail-value" id="dash-username">—</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Почта:</span>
                        <span class="detail-value" id="dash-email">—</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">База данных:</span>
                        <span class="detail-value badge-active">SQLite3</span>
                    </div>
                </div>
                <button type="button" class="logout-btn" id="logout-btn">Выйти из профиля</button>
            </div>

            <footer class="card-footer">
                <p class="footer-note">FastAPI &amp; SQLite</p>
                <div class="api-link-wrap">
                    <a href="/docs" target="_blank" class="docs-link">
                        Swagger API &rarr;
                    </a>
                </div>
            </footer>
        </main>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
